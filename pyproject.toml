    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "psutil>=7.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "sqladmin>=0.24.0",
    "sqlalchemy[asyncio,mypy]>=2.0.48",
    "starlette>=1.0.0",
    "wtforms>=3.1.2",
    "python-slugify>=8.0.4",
    "bcrypt>=4.2.0",
    "PyJWT>=2.9.0",
    "minio>=7.2.0",
